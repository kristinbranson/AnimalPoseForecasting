# Install with `pip install -e .`, which also installs the commands under [project.scripts].
#
# Version ranges are loose on purpose, so that in a conda env made from environment/*.yml, pip doesn't replace
# the packages conda installed (it does install ratinabox, scikit-learn, transformers, and pytest, which those
# envs lack).  But they stay within the major version in use (for 0.x versions, the minor version).  Exact
# versions belong in the environment that uses this package (a conda env file, or a uv lock file).

[project]
name = "AnimalPoseForecasting"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "h5py>=3.8,<4",
    "hdf5storage>=0.1.19,<0.2",
    "tqdm>=4.60,<5",
    "ipython>=9.0,<10",
    "torch>=2.5,<3",
    # synthrat needs the patched fork at https://github.com/kristinbranson/RatInABox (branch speedup), not the
    # PyPI release (see environment/README.md), so install that one first
    "ratinabox>=1.15,<2",
    # for flyllm.optimal_binning's k-means binning
    "scikit-learn>=1.2,<2",
    # for flyllm/run_flyllm.py, which uses transformers.optimization.AdamW, removed in 4.50
    "transformers>=4.30,<4.50",
    "pytest>=9.0,<10",
]

[project.scripts]
build-dataset-cache = "flyllm.build_dataset_cache:main"
launch-build-dataset-cache = "flyllm.launch_build_dataset_cache:main"
train-flyllm = "flyllm.train:main"
launch-train-flyllm = "flyllm.launch_train:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flyllm", "flyllm.*", "apf", "apf.*", "experiments", "experiments.*", "synthrat", "jaaba_detect",
           "jaaba_detect.*", "tests", "tests.*"]

[tool.setuptools.package-data]
jaaba_detect = ["ellipse_from_keypoints.json"]
