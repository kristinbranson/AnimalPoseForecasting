# This pyproject.toml is intended to be used with `uv` to set up an
# env suitable for running APF code.  It currently does not handle the
# rat-in-a-box stuff.

# To use it, create a symlink to this file in
# `AnimalPoseForecasting/`, and a symlink in `AnimalPoseForecasting/`
# to `environment/uv.lock`.  Then in `AnimalPoseForecasting/` do `uv
# sync` to create the env.  After that, `uv run python foo.py` will
# run `foo.py` using the env's Python executable.

# Version ranges are loose, but stay within the major version in use
# (for 0.x versions, the minor version).  The exact versions are in
# the uv.lock file that `uv sync` writes.

[project]
name = "AnimalPoseForecasting"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "h5py>=3.8,<4",
    "hdf5storage>=0.1.19,<0.2",
    "tqdm>=4.60,<5",
    "ipython>=9.0,<10",
    "torch>=2.5,<3",
    # for flyllm.optimal_binning's k-means binning
    "scikit-learn>=1.2,<2",
    # for flyllm/run_flyllm.py, which uses transformers.optimization.AdamW, removed in 4.50
    "transformers>=4.30,<4.50",
    "pytest>=9.0,<10",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flyllm", "flyllm.*", "apf", "apf.*", "experiments", "experiments.*", "synthrat", "jaaba_detect",
           "jaaba_detect.*", "tests", "tests.*"]
# setup.py uses find_packages, which only finds dirs with an __init__.py
namespaces = false

[tool.setuptools.package-data]
jaaba_detect = ["ellipse_from_keypoints.json"]
